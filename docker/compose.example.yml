# Example compose file for ShrinkYourShit. Copy to docker-compose.yml and
# adjust the volume paths, then `docker compose up -d`.

services:
  shrinkyourshit:
    image: ghcr.io/peiceoftoast/shrinkyourshit:latest
    container_name: shrinkyourshit
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - PUID=1000
      - PGID=1000
      # Optional: the image defaults are already set.
      # - SHRINK_LOG_LEVEL=debug
      # - SHRINK_FFMPEG_PATH=/usr/lib/jellyfin-ffmpeg/ffmpeg
    volumes:
      - ./config:/config
      - /path/to/your/media:/media
      - ./scratch:/scratch

    # --- Network storage (NFS and SMB shares, added from the Storage page) ---
    # SYS_ADMIN lets the container run mount(8) for the shares you add in the
    # WebUI. It is one capability, far narrower than `privileged: true`, which
    # grants every capability and every device. apparmor=unconfined is needed
    # because Docker's default AppArmor profile blocks mount(2). Without these
    # two lines the app still starts: the startup log says the capability is
    # missing, and each storage shows the mount error. Leave them out if you
    # do not want network storage.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined

    # --- NVIDIA GPU (NVENC): uncomment this block ---
    # environment:
    #   - PUID=1000
    #   - PGID=1000
    #   - NVIDIA_VISIBLE_DEVICES=all
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # Or, on engines that support it:  runtime: nvidia

    # --- Intel GPU (QSV/VAAPI): uncomment this block ---
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "109"  # render group id on the host (check with: getent group render)
