# SPDX-License-Identifier: AGPL-3.0-only
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Create web UI placeholder for go:embed
        run: make placeholder
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
      - name: SPDX headers
        run: ./scripts/check-spdx.sh
      - name: go test (unit)
        run: go test ./...
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: go test (integration)
        run: go test -tags=integration ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: eslint
        run: npm run lint
      - name: prettier
        run: npm run format:check
      - name: vitest
        run: npm run test
      - name: build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Task 29: the NAS deploy templates must stay valid compose files.
      # deploy/deploy_test.go checks the contract in `go test`; this step
      # additionally proves the three files parse as compose on the engine
      # users actually run (no daemon needed for `config`).
      - name: NAS deploy templates validate (docker compose config)
        run: |
          set -eu
          for f in deploy/generic/docker-compose.yml \
            deploy/synology/docker-compose.yml \
            deploy/truenas/docker-compose.yml; do
            docker compose -f "$f" config --quiet
            echo "ok: $f"
          done
      - name: Build identity (task 26)
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build image
        run: |
          docker build -f docker/Dockerfile \
            --build-arg VERSION="v0.0.0-ci" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            -t shrinkyourshit:ci .
      # Task 26: every PR proves the image carries the commit and the
      # build date, not just the version. This is the regression gate for
      # `commit: none` inside Docker (docker is unavailable on dev VMs).
      - name: Image reports version, commit and build date
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          container="$(docker run -d -p 18765:8765 \
            -e SHRINK_DISCOVERY_MDNS=false \
            -e SHRINK_DISCOVERY_BROADCAST=false \
            shrinkyourshit:ci)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          json=""
          for _ in $(seq 1 30); do
            if json="$(curl -fsS http://127.0.0.1:18765/api/v1/version 2>/dev/null)"; then
              break
            fi
            sleep 1
          done
          printf '%s\n' "$json"
          if [ -z "$json" ]; then
            echo "::error::/api/v1/version did not answer within 30 seconds" >&2
            exit 1
          fi
          read_field() {
            printf '%s' "$json" | python3 -c "import json,sys; print(json.load(sys.stdin)[\"$1\"])"
          }
          [ "$(read_field commit)" = "$EXPECTED_COMMIT" ] || {
            echo "::error::image commit is '$(read_field commit)', expected '$EXPECTED_COMMIT'" >&2
            exit 1
          }
          build_date="$(read_field date)"
          if [ -z "$build_date" ] || [ "$build_date" = "unknown" ]; then
            echo "::error::image build date is '$build_date', expected a UTC timestamp" >&2
            exit 1
          fi
          [ "$(read_field version)" = "v0.0.0-ci" ] || {
            echo "::error::image version is '$(read_field version)', expected 'v0.0.0-ci'" >&2
            exit 1
          }
      - name: ffmpeg has the v1 encoder stack (NVENC + QSV/VAAPI)
        run: |
          docker run --rm --entrypoint /usr/lib/jellyfin-ffmpeg/ffmpeg shrinkyourshit:ci -version \
            | grep -E -- '--enable-nvenc'
          docker run --rm --entrypoint /usr/lib/jellyfin-ffmpeg/ffmpeg shrinkyourshit:ci -version \
            | grep -E -- '--enable-libvpl'
          docker run --rm --entrypoint /usr/lib/jellyfin-ffmpeg/ffmpeg shrinkyourshit:ci -hide_banner -encoders \
            | grep -w 'h264_qsv'
          docker run --rm --entrypoint /usr/lib/jellyfin-ffmpeg/ffmpeg shrinkyourshit:ci -hide_banner -encoders \
            | grep -w 'h264_nvenc'
      # Task 28: the Dockerfile must fail the build naming the arch for
      # any architecture without a pinned jellyfin-ffmpeg deb, never
      # default silently to amd64. Regression gate for the TARGETARCH
      # selection rule.
      - name: Unsupported TARGETARCH fails the build
        run: |
          set -eu
          if docker build -f docker/Dockerfile \
            --build-arg TARGETARCH=riscv64 \
            --build-arg VERSION="v0.0.0-ci" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            -t shrinkyourshit:bad-arch . 2>/tmp/bad-arch.log; then
            echo "::error::TARGETARCH=riscv64 build succeeded, but it must fail" >&2
            exit 1
          fi
          grep -q "is not pinned for TARGETARCH 'riscv64'; supported: amd64, arm64" /tmp/bad-arch.log || {
            echo "::error::the failure must name the arch; log tail:" >&2
            tail -20 /tmp/bad-arch.log >&2
            exit 1
          }
          tail -3 /tmp/bad-arch.log
      - name: Image serves the UI and the health endpoint
        run: |
          container=$(docker run -d -p 8765:8765 shrinkyourshit:ci)
          sleep 2
          curl -fsS http://localhost:8765/api/v1/health | grep -o '"status":"ok"'
          curl -fsS http://localhost:8765/ | grep -o '<title>ShrinkYourShit</title>'
          docker rm -f "$container" > /dev/null
      - name: Image serves the templated installer scripts
        run: |
          container=$(docker run -d -p 8765:8765 shrinkyourshit:ci)
          sleep 2
          curl -fsS http://localhost:8765/install.sh | grep -o 'SERVER="http://localhost:8765"'
          curl -fsS http://localhost:8765/install.ps1 | grep -o "'http://localhost:8765'"
          docker rm -f "$container" > /dev/null


  # Task 28: prove the arm64 image on every PR. The release pipeline
  # (release.yml) runs the same proof before publishing a release, but the
  # project's agent token cannot dispatch that workflow, so this job is the
  # PR regression gate: build the arm64 image, boot it under qemu
  # emulation, require /api/v1/health and the bundled ffmpeg, then assemble
  # the multi-platform manifest on a local registry and inspect it. Nothing
  # is published.
  docker-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build identity
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Buildx config (plain HTTP for the local proof registry)
        run: |
          cat > /tmp/buildkitd.toml <<'EOF'
          [registry."127.0.0.1:5000"]
            http = true
          EOF
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config: /tmp/buildkitd.toml
          driver-opts: |
            network=host
      - name: Start the local proof registry
        run: |
          set -eu
          docker run -d --name proof-registry -p 127.0.0.1:5000:5000 registry:2
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/v2/ >/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "${ok:-0}" = 1 || { echo "::error::local proof registry did not start" >&2; exit 1; }
      - name: Build the arm64 image (loaded for the boot smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          build-args: |
            VERSION=v0.0.0-ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: shrinkyourshit:ci-arm64
      - name: Smoke test the arm64 image (boot under emulation)
        run: |
          set -eu
          mkdir -p /tmp/armcfg
          docker run --rm --platform linux/arm64 -d --name sys-arm64 \
            -e PUID=1000 -e PGID=1000 \
            -e SHRINK_DISCOVERY_MDNS=false \
            -e SHRINK_DISCOVERY_BROADCAST=false \
            -v /tmp/armcfg:/config \
            -p 127.0.0.1:8765:8765 \
            shrinkyourshit:ci-arm64
          trap 'docker rm -f sys-arm64 >/dev/null 2>&1 || true' EXIT
          ok=0
          for i in $(seq 1 30); do
            if json="$(curl -fsS http://127.0.0.1:8765/api/v1/health 2>/dev/null)"; then ok=1; break; fi
            sleep 2
          done
          docker logs sys-arm64 | tail -50
          test "${ok:-0}" = "1" || { docker rm -f sys-arm64; exit 1; }
          printf '%s\n' "$json"
          banner="$(docker exec sys-arm64 /usr/lib/jellyfin-ffmpeg/ffmpeg -hide_banner -version | head -2)"
          printf '%s\n' "$banner"
          test -n "$banner" || { echo "::error::the bundled ffmpeg did not run inside the arm64 image" >&2; exit 1; }
      - name: Push multi-platform image to the local proof registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=v0.0.0-ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: 127.0.0.1:5000/shrinkyourshit:proof
      - name: Verify the manifest list has both architectures
        run: |
          set -eu
          inspect="$(docker buildx imagetools inspect 127.0.0.1:5000/shrinkyourshit:proof)"
          printf '%s\n' "$inspect"
          grep -q 'linux/amd64' <<< "$inspect" || {
            echo "::error::manifest does not list linux/amd64" >&2; exit 1; }
          grep -q 'linux/arm64' <<< "$inspect" || {
            echo "::error::manifest does not list linux/arm64" >&2; exit 1; }

  # Task 12: Playwright layout suite against the real binary. The docker
  # image serves the built web app (embedded, no dev server), a browser
  # drives it at phone, tablet and desktop widths over the seeded state,
  # and failing runs upload their screenshots as artifacts.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci (web)
        working-directory: web
        run: npm ci --no-fund --no-audit
      - name: Build image (web app + Go binary, UI embedded)
        run: docker build -f docker/Dockerfile -t shrinkyourshit:e2e .
      - name: ffmpeg for the seeded test media
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Fixture dirs (owned by the runner, container runs as the same uid)
        run: mkdir -p .e2e/config .e2e/scratch .e2e/media/e2e-lib
      - name: Run the image
        run: |
          docker run -d --name shrink-e2e \
            -p 127.0.0.1:8712:8765 \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -e SHRINK_DISCOVERY_MDNS=false -e SHRINK_DISCOVERY_BROADCAST=false \
            -v "$PWD/.e2e/config:/config" \
            -v "$PWD/.e2e/scratch:/scratch" \
            -v "$PWD/.e2e/media:/media" \
            shrinkyourshit:e2e
      - name: Install the browser (with system deps)
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run the layout suite
        working-directory: web
        env:
          SHRINK_E2E_BASE_URL: http://127.0.0.1:8712
          SHRINK_E2E_MEDIA_DIR: ${{ github.workspace }}/.e2e/media/e2e-lib
          SHRINK_E2E_LIBRARY_PATH: /media/e2e-lib
        run: npx playwright test
      - name: Upload failure artifacts (screenshots, traces, report)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
      - name: Stop the image
        if: always()
        run: docker rm -f shrink-e2e

  # Task 16: every release target must compile, including windows/amd64,
  # whose syscall.Handle fd type once broke the release binaries job only
  # after the docker image had already published (v0.1.0).
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: make cross

  # Installer checks (task 09): shellcheck over the POSIX installer, an
  # install run inside a throwaway container against a fake release
  # server, a structural systemd-analyze verify of the written unit, and
  # PSScriptAnalyzer over the PowerShell installer on a Windows runner.
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          make installer-check
      - name: Fake release server (release layout of the GitHub release)
        run: |
          make placeholder
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o /tmp/fake/v0.0.0-test/shrinkyourshit-linux-amd64 ./cmd/shrinkyourshit
          tar -czf /tmp/fake/v0.0.0-test/shrinkyourshit-linux-amd64.tar.gz \
            -C /tmp/fake/v0.0.0-test shrinkyourshit-linux-amd64
          python3 -m http.server 8099 --directory /tmp/fake &
          sleep 1
      - name: Install inside a throwaway container (debian bookworm)
        run: |
          docker run --rm --network=host -v "$PWD":/repo debian:bookworm-slim \
            bash -c 'apt-get update -qq >/dev/null \
              && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null \
              && REPO_DIR=/repo FAKE_RELEASE_URL=http://127.0.0.1:8099 sh /repo/scripts/test-installer.sh'
      - name: systemd unit verifies (systemd-analyze on the runner)
        run: |
          tmp="$(mktemp -d)"
          sh scripts/installer.sh \
            --server http://127.0.0.1:8765 \
            --version v0.0.0-test \
            --release-url http://127.0.0.1:8099 \
            --install-dir "$tmp/bin" \
            --data-dir "$tmp/data" \
            --service-dir "$tmp/systemd" \
            --token ci-token
          systemd-analyze verify "$tmp/systemd/shrinkyourshit.service"
          rm -rf "$tmp"

  installer-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer over installer.ps1
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path scripts/installer.ps1 -Severity Error -EnableExit

  # Posts the job results as a PR comment so agents and owners can read CI
  # state without the Actions/Checks API scope. The comment is best-effort;
  # the run summary is the reliable copy.
  report:
    needs: [go, web, docker, docker-arm64, installer, installer-powershell, e2e, cross]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Summarize
        run: |
          {
            echo "## CI report"
            echo "- go: ${{ needs.go.result }}"
            echo "- web: ${{ needs.web.result }}"
            echo "- docker: ${{ needs.docker.result }}"
            echo "- docker-arm64: ${{ needs.docker-arm64.result }}"
            echo "- installer (shell): ${{ needs.installer.result }}"
            echo "- installer (powershell): ${{ needs.installer-powershell.result }}"
            echo "- e2e: ${{ needs.e2e.result }}"
            echo "- cross: ${{ needs.cross.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the PR
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            if (!context.issue.number) return
            const body = [
              'CI report:',
              `- go: **${{ needs.go.result }}**`,
              `- web: **${{ needs.web.result }}**`,
              `- docker: **${{ needs.docker.result }}**`,
              `- docker-arm64: **${{ needs.docker-arm64.result }}**`,
              `- installer (shell): **${{ needs.installer.result }}**`,
              `- installer (powershell): **${{ needs.installer-powershell.result }}**`,
              `- e2e: **${{ needs.e2e.result }}**`,
              `- cross: **${{ needs.cross.result }}**`,
            ].join('\n')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
