# SPDX-License-Identifier: AGPL-3.0-only
name: release

# Tag push: full publish (binaries + checksums.txt attached to the release,
# container image pushed). workflow_dispatch: a dry run (task 16) — it
# builds and verifies everything but uploads nothing and pushes nothing,
# so the pipeline can be proven without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI and copy it into the embed location
        run: |
          cd web && npm ci --no-fund --no-audit && npm run build
          cd ..
          rm -rf internal/webui/dist
          cp -r web/dist internal/webui/dist
      - name: Cross-compile all five targets (version, commit and build date embedded)
        run: ./scripts/release.sh build "${GITHUB_REF_NAME}" dist
      - name: Package archives (tar.gz unix, zip windows)
        run: ./scripts/release.sh package dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # checksums (task 16): checksums.txt is the updater's verification root,
  # so it is produced and verified in its own job and attached to the
  # release; docker only publishes after this job passed.
  checksums:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist
      - name: Write checksums.txt over every archive
        run: ./scripts/release.sh checksums dist
      - name: Verify every archive against checksums.txt
        run: ./scripts/release.sh verify dist
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error
      - name: Attach archives and checksums.txt to the release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # Docker publishes only after the binaries and their checksums are
  # proven, so an image never goes out from a broken release.
  docker:
    needs: [binaries, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Self-hosted media compression for home media servers

# Package visibility note (task 16): the first push creates the ghcr
# package private even on a public repository. One manual step, once:
# package settings -> change visibility to public and enable "inherited
# access" from the repository, so later pushes stay public. Anonymous
# pulls are the point of publishing; this is already done for
# ghcr.io/peiceoftoast/shrinkyourshit (see tasks/hermes-log.md, v0.1.0).
