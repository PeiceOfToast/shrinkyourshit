# SPDX-License-Identifier: AGPL-3.0-only
name: release

# Tag push: full publish (binaries + checksums.txt attached to the release,
# container image pushed). workflow_dispatch: a dry run (task 16) — it
# builds and verifies everything but uploads nothing and pushes nothing,
# so the pipeline can be proven without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  # Task 26: one job owns the build identity. The binaries and the image
  # get the same version, commit and UTC build date from its outputs.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      build_date: ${{ steps.identity.outputs.build_date }}
    steps:
      - name: Compute version, commit and UTC build date
        id: identity
        run: |
          {
            echo "version=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

  binaries:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI and copy it into the embed location
        run: |
          cd web && npm ci --no-fund --no-audit && npm run build
          cd ..
          rm -rf internal/webui/dist
          cp -r web/dist internal/webui/dist
      - name: Cross-compile all five targets (version, commit and build date embedded)
        env:
          COMMIT: ${{ needs.prepare.outputs.commit }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
        run: ./scripts/release.sh build "${{ needs.prepare.outputs.version }}" dist
      - name: Package archives (tar.gz unix, zip windows)
        run: ./scripts/release.sh package dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # checksums (task 16): checksums.txt is the updater's verification root,
  # so it is produced and verified in its own job and attached to the
  # release; docker only publishes after this job passed.
  checksums:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist
      - name: Write checksums.txt over every archive
        run: ./scripts/release.sh checksums dist
      - name: Verify every archive against checksums.txt
        run: ./scripts/release.sh verify dist
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error
      - name: Attach archives and checksums.txt to the release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # Docker publishes only after the binaries and their checksums are
  # proven, so an image never goes out from a broken release.
  docker:
    needs: [prepare, binaries, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build image (loaded locally, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.commit }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.build_date }}
            org.opencontainers.image.description=Self-hosted media compression for home media servers

      # Task 26: the running image must report the release identity. A
      # `commit: none` here means the Dockerfile stopped forwarding the
      # build args; fail now, before anything reaches the registry.
      - name: Smoke test the version endpoint
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -eu
          image="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          container="$(docker run -d -p 18765:8765 \
            -e SHRINK_DISCOVERY_MDNS=false \
            -e SHRINK_DISCOVERY_BROADCAST=false \
            "$image")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          json=""
          for _ in $(seq 1 30); do
            if json="$(curl -fsS http://127.0.0.1:18765/api/v1/version 2>/dev/null)"; then
              break
            fi
            sleep 1
          done
          printf '%s\n' "$json"
          if [ -z "$json" ]; then
            echo "::error::/api/v1/version did not answer within 30 seconds" >&2
            exit 1
          fi
          read_field() {
            printf '%s' "$json" | python3 -c "import json,sys; print(json.load(sys.stdin)[\"$1\"])"
          }
          version="$(read_field version)"
          commit="$(read_field commit)"
          build_date="$(read_field date)"
          if [ "$commit" != "$EXPECTED_COMMIT" ]; then
            echo "::error::image commit is '$commit', expected '$EXPECTED_COMMIT'" >&2
            exit 1
          fi
          if [ -z "$build_date" ] || [ "$build_date" = "unknown" ]; then
            echo "::error::image build date is '$build_date', expected a UTC timestamp" >&2
            exit 1
          fi
          if [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "::error::image version is '$version', expected '$EXPECTED_VERSION'" >&2
            exit 1
          fi

      - name: Push image
        if: github.event_name == 'push'
        run: |
          set -eu
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done

# Package visibility note (task 16): the first push creates the ghcr
# package private even on a public repository. One manual step, once:
# package settings -> change visibility to public and enable "inherited
# access" from the repository, so later pushes stay public. Anonymous
# pulls are the point of publishing; this is already done for
# ghcr.io/peiceoftoast/shrinkyourshit (see tasks/hermes-log.md, v0.1.0).
